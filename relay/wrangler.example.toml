name = "kongjing-relay"
main = "src/worker.mjs"
compatibility_date = "2026-10-21"
workers_dev = true
preview_urls = false


[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "GROUPS"
class_name = "GroupRoom"
[[durable_objects.bindings]]
name = "PAIRS"
class_name = "PairRoom"
[[durable_objects.bindings]]
name = "GUARDS"
class_name = "Guard"
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GroupRoom", "PairRoom", "Guard"]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "kongjing-sync"

[observability]
enabled = false

[vars]
EXTRA_ORIGINS = "https://appassets.androidplatform.net"
